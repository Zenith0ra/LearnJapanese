<script>
  /* 出错时直接在页面上显示，避免白屏无从排查 */
  function showErr(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0 auto auto 0;z-index:999;background:#b0442c;color:#fff;padding:8px 14px;font:13px/1.5 monospace;white-space:pre-wrap;max-width:100%';
    d.textContent = '脚本错误：' + msg;
    document.body.appendChild(d);
  }
  window.addEventListener('error', function (e) { showErr(e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { showErr('Promise: ' + ((e.reason && e.reason.message) || e.reason)); });
</script>
